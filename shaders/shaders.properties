oldLighting=false
separateAo=true

# Post-processing

# Debug


# The small lookups reuse bloom buffers until bloom extraction starts.
texture.noise=textures/sky-noise.png
# Weather uses the submitted UV convention and the already-bound native sprite.
# Avoid resolving the other vanilla sprite while a Minecraft render pass is open.
# Shadow glint overlays must not replace the base actor's optical material.
# These sampler slots are not read by the forward material programs.
texture.gbuffers.gaux4=minecraft:textures/misc/enchanted_glint_armor.png
texture.gbuffers.colortex14=minecraft:textures/misc/enchanted_glint_item.png
# C5 is image-only in composite. Its sampler can address the live block atlas.
texture.composite.colortex5=minecraft:textures/atlas/blocks.png
texture.composite.colortex1=minecraft:textures/atlas/blocks_n.png
texture.composite.colortex2=minecraft:textures/atlas/blocks_s.png
# C13 holds persistent HDR, linear depth and five camera/lightning state pixels.
# Use the default scene size; an explicit custom size prevents mixed MRT in OptiFine.
scale.deferred=0.25
scale.composite2=0.25
scale.composite3=0.25
# Option macros are unavailable during the loader's first screen/profile scan.
#ifdef VOLUMETRIC_RESOLUTION
#if VOLUMETRIC_RESOLUTION == 0
scale.composite=0.25
scale.composite1=0.25
#else
scale.composite=0.5
scale.composite1=0.5
#endif
#else
scale.composite=0.5
scale.composite1=0.5
#endif

# Companion controls configure independent raster maps and radiance transport.

# Keep the bloom viewport consistent with bloomSize(); earlier passes reuse the full allocation.
#if BLOOM_RESOLUTION == 0
scale.composite15=0.5
scale.composite16=0.5
scale.composite17=0.5
scale.composite18=0.5
scale.composite19=0.5
#else
scale.composite15=1.0
scale.composite16=1.0
scale.composite17=1.0
scale.composite18=1.0
scale.composite19=1.0
#endif

