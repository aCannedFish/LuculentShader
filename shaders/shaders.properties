# Luculent rendering directives and option pages.
# Values and allowed ranges are declared beside each setting in settings.glsl.
# Labels are localized in lang/; the loader persists user selections.
# Subpages use square brackets in screen definitions.
iris.features.optional=FADE_VARIABLE

# Presets control both expensive features and their budgets. Mid matches the
# defaults; Low favors responsiveness, while High/Ultra favor quality at 30 FPS.
