# Luculent rendering directives and option pages.
# Values and allowed ranges are declared beside each setting in settings.glsl.
# Labels are localized in lang/; the loader persists user selections.
# Subpages use square brackets in screen definitions.
iris.features.optional=FADE_VARIABLE

# Presets control both expensive features and their budgets. Mid matches the
# defaults; Low favors responsiveness, while High/Ultra favor quality at 30 FPS.
profile.LOW = ENABLE_COLOURED_LIGHTING=0 GI_QUALITY=0 GI_MULTIBOUNCE=0 WATER_REFRACTION_STRENGTH=0.0 POM_QUALITY=0 POM_DISTANCE=16.0 ATMOSPHERE_STEPS=6 AURORA_STEPS=8 VOLUMETRIC_RESOLUTION=0 AIR_SCATTER_STEPS=16 WATER_SHAFT_STEPS=4 BLOOM_RESOLUTION=0 SHADOW_SOFTNESS=0 shadowMapResolution=1024 shadowDistance=64.0 CLOUD_QUALITY=0 SKY_SAMPLES=16 WATER_REFLECTION_CLOUDS=0 WATER_REFLECTION_STEPS=16 REFLECTION_OCCLUSION_STEPS=6 COLOURED_VOLUME_SIZE=32 COLOURED_LIGHT_STEPS=1 AA_MODE=1 WATER_REFLECTION_MOTION_BLUR=0 ENABLE_MOTION_BLUR=0 ENABLE_DOF=0 ENABLE_AUTO_EXPOSURE=1
profile.MID = ENABLE_COLOURED_LIGHTING=1 GI_QUALITY=1 GI_MULTIBOUNCE=0 WATER_REFRACTION_STRENGTH=1.0 POM_QUALITY=1 POM_DISTANCE=32.0 ATMOSPHERE_STEPS=6 AURORA_STEPS=8 VOLUMETRIC_RESOLUTION=0 AIR_SCATTER_STEPS=16 WATER_SHAFT_STEPS=8 BLOOM_RESOLUTION=0 SHADOW_SOFTNESS=0 shadowMapResolution=1024 shadowDistance=64.0 CLOUD_QUALITY=0 SKY_SAMPLES=16 WATER_REFLECTION_CLOUDS=0 WATER_REFLECTION_STEPS=16 REFLECTION_OCCLUSION_STEPS=6 COLOURED_VOLUME_SIZE=32 COLOURED_LIGHT_STEPS=1 AA_MODE=3 WATER_REFLECTION_MOTION_BLUR=0 ENABLE_MOTION_BLUR=0 ENABLE_DOF=0 ENABLE_AUTO_EXPOSURE=1
profile.HIGH = ENABLE_COLOURED_LIGHTING=1 GI_QUALITY=2 GI_MULTIBOUNCE=1 WATER_REFRACTION_STRENGTH=1.0 POM_QUALITY=2 POM_DISTANCE=48.0 ATMOSPHERE_STEPS=10 AURORA_STEPS=12 VOLUMETRIC_RESOLUTION=1 AIR_SCATTER_STEPS=32 WATER_SHAFT_STEPS=12 BLOOM_RESOLUTION=0 SHADOW_SOFTNESS=1 shadowMapResolution=2048 shadowDistance=96.0 CLOUD_QUALITY=1 SKY_SAMPLES=24 WATER_REFLECTION_CLOUDS=1 WATER_REFLECTION_STEPS=32 REFLECTION_OCCLUSION_STEPS=10 COLOURED_VOLUME_SIZE=48 COLOURED_LIGHT_STEPS=2 AA_MODE=3 WATER_REFLECTION_MOTION_BLUR=1 ENABLE_MOTION_BLUR=0 ENABLE_DOF=0 ENABLE_AUTO_EXPOSURE=1
profile.ULTRA = ENABLE_COLOURED_LIGHTING=1 GI_QUALITY=3 GI_MULTIBOUNCE=1 WATER_REFRACTION_STRENGTH=1.0 POM_QUALITY=3 POM_DISTANCE=64.0 ATMOSPHERE_STEPS=16 AURORA_STEPS=16 VOLUMETRIC_RESOLUTION=1 AIR_SCATTER_STEPS=48 WATER_SHAFT_STEPS=24 BLOOM_RESOLUTION=1 SHADOW_SOFTNESS=2 shadowMapResolution=3072 shadowDistance=128.0 CLOUD_QUALITY=2 SKY_SAMPLES=32 WATER_REFLECTION_CLOUDS=1 WATER_REFLECTION_STEPS=64 REFLECTION_OCCLUSION_STEPS=16 COLOURED_VOLUME_SIZE=64 COLOURED_LIGHT_STEPS=3 AA_MODE=3 WATER_REFLECTION_MOTION_BLUR=1 ENABLE_MOTION_BLUR=0 ENABLE_DOF=0 ENABLE_AUTO_EXPOSURE=1

# Main option pages
screen = <profile> ENABLE_COLOURED_LIGHTING [SHADOWS] [LIGHTING] [WORLD] [WATER] [MATERIALS] [VEGETATION] [POST] [DEBUG]

# Blend the sky base and sunset layer with alpha.
# Add sun/moon sprites so their black backgrounds do not cover the sky.
blend.gbuffers_skybasic=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_skytextured=ONE ONE ONE ONE
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Non-water fragments preserve water metadata with zero output alpha.
blend.gbuffers_water.colortex9=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex7=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Reuse geometry/light attachments after opaque drawing; retain debug data.
#if DEBUG_VIEW == 0
blend.gbuffers_water.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex2=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#else
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
#endif
blend.gbuffers_clouds=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Weather stores background transmittance in C0 alpha for the medium pass.
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE_MINUS_SRC_ALPHA
#if DEBUG_VIEW == 0
blend.gbuffers_weather.colortex1=ONE ONE ONE ONE
#endif
alphaTest.gbuffers_clouds=off
alphaTest.gbuffers_weather=off
# Keep low-opacity water fragments through the loader alpha test.
alphaTest.gbuffers_water=off

# Shadow colour stores the nearest caster and must overwrite its predecessor.
blend.shadow=off
# Opaque material must survive the translucent shadow draw, as does shadowtex1.
#ifdef IS_IRIS
blend.shadow.colortex1=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#else
blend.shadow.shadowcolor1=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#endif

# Composite draws volumetric clouds; disable the vanilla cloud mesh.
clouds=off
rain.depth=false
# Opaque splash particles must reach depth before the water metadata is drawn.
particles.before.deferred=true
# Smooth puddle eligibility using the current biome precipitation type.
uniform.float.rainBiome=smooth(91, if(in(biome_precipitation, 1), 1.0, 0.0), 6.0, 6.0)

# Shadows
screen.SHADOWS = ENABLE_SHADOWS SHADOW_SOFTNESS shadowMapResolution shadowDistance SHADOW_MAP_BIAS SHADOW_BIAS
screen.SHADOWS.columns = 2

# Lighting
screen.LIGHTING = [LOCAL_LIGHTS] [GI] MIN_AMBIENT_LIGHT AMBIENT_STRENGTH SUNLIGHT_STRENGTH MOONLIGHT_STRENGTH NIGHT_AMBIENT_STRENGTH NIGHT_EXPOSURE SKY_TINT BLOCK_LIGHT_STRENGTH BLOCK_LIGHT_FALLOFF SMOOTH_BLOCK_LIGHT ENABLE_COLOURED_LIGHTING
screen.LIGHTING.columns = 2

# World and atmosphere
screen.WORLD = ENABLE_CHUNK_TRANSITION CHUNK_TRANSITION_WIDTH VOLUMETRIC_RESOLUTION FOG_DENSITY [ATMOSPHERE] [WEATHER] [SKY] [CLOUDS] [DIMENSIONS]
screen.WORLD.columns = 2
screen.WEATHER = ENABLE_REALISTIC_RAIN ENABLE_RAIN_PUDDLES RAIN_PUDDLES_STRENGTH RAIN_RIPPLE_STRENGTH RAIN_FOG_STRENGTH
screen.WEATHER.columns = 2

# Water
screen.WATER = UNDERWATER_MIN_VISIBILITY WATER_CAUSTICS_STRENGTH UNDERWATER_SHAFT_STRENGTH WATER_SHAFT_STEPS UNDERWATER_DENSITY UNDERWATER_DEPTH_DIMMING WATER_SURFACE_OPACITY WATER_TURBIDITY WATER_ABSORPTION WATER_REFRACTION_STRENGTH ENABLE_WATER_TEXTURE ENABLE_WATER_WAVES WATER_WAVE_STRENGTH WATER_COLOR_LIGHTNESS WATER_ROUGHNESS WATER_REFLECTION_STRENGTH WATER_REFLECTION_MOTION_BLUR WATER_SPECULAR_STRENGTH WATER_REFLECTION_BRIGHTNESS WATER_REFLECTION_CLOUDS WATER_REFLECTION_STEPS REFLECTION_OCCLUSION_STEPS
screen.WATER.columns = 2

# Vegetation
screen.VEGETATION = FOLIAGE_TRANSLUCENCY ENABLE_FOLIAGE_WIND WIND_STRENGTH WIND_SPEED LEAF_SWAY_STRENGTH PLANT_SWAY_STRENGTH
screen.VEGETATION.columns = 2
sliders = WATER_WAVE_STRENGTH ORE_GLOW_STRENGTH GROUND_FOG_STRENGTH GROUND_FOG_HEIGHT AURORA_STRENGTH TWILIGHT_STRENGTH NETHER_ATMOSPHERE END_ATMOSPHERE MATERIAL_REFLECTION_STRENGTH NETHER_AMBIENT END_AMBIENT NETHER_FOG_DENSITY END_FOG_DENSITY MIN_AMBIENT_LIGHT LENS_FLARE_STRENGTH CHROMATIC_ABERRATION_STRENGTH AIR_SCATTER_STRENGTH LOCAL_LIGHT_RADIUS LOCAL_SHADOW_SOFTNESS LOCAL_SHADOW_STRENGTH LIGHTING_UPDATE_INTERVAL GI_STRENGTH GI_REFLECTANCE NIGHT_AMBIENT_STRENGTH NIGHT_EXPOSURE SKY_HAZE SKY_EXPOSURE CELESTIAL_SIZE CLOUD_COVERAGE CLOUD_DENSITY CLOUD_BRIGHTNESS CLOUD_SHADOW_STRENGTH MOONLIGHT_STRENGTH BLOCK_LIGHT_FALLOFF CLOUD_NIGHT_BRIGHTNESS UNDERWATER_MIN_VISIBILITY WATER_CAUSTICS_STRENGTH UNDERWATER_SHAFT_STRENGTH WATER_SHAFT_STEPS UNDERWATER_DENSITY UNDERWATER_DEPTH_DIMMING WIND_STRENGTH WIND_SPEED LEAF_SWAY_STRENGTH PLANT_SWAY_STRENGTH WATER_SURFACE_OPACITY WATER_TURBIDITY WATER_ABSORPTION WATER_REFRACTION_STRENGTH WATER_COLOR_LIGHTNESS WATER_ROUGHNESS WATER_REFLECTION_STRENGTH WATER_SPECULAR_STRENGTH WATER_REFLECTION_BRIGHTNESS BLOCK_LIGHT_STRENGTH RAIN_PUDDLES_STRENGTH RAIN_FOG_STRENGTH

# Calculate directional light separately; vertex RGB is tint and AO affects indirect light.
oldLighting=false
separateAo=true

# Post-processing
screen.POST = AA_MODE [TEMPORAL] [CAMERA] [EXPOSURE] [BLOOM] [GRADING] ENABLE_LENS_FLARE LENS_FLARE_STRENGTH ENABLE_CHROMATIC_ABERRATION CHROMATIC_ABERRATION_STRENGTH VIGNETTE ENABLE_DITHER
screen.POST.columns = 2

# Debug
screen.DEBUG = DEBUG_VIEW




# The small lookups reuse bloom buffers until bloom extraction starts.
texture.noise=textures/sky-noise.png
# Weather uses the submitted UV convention and the already-bound native sprite.
# Avoid resolving the other vanilla sprite while a Minecraft render pass is open.
# Shadow glint overlays must not replace the base actor's optical material.
# These sampler slots are not read by the forward material programs.
texture.gbuffers.gaux4=minecraft:textures/misc/enchanted_glint_armor.png
texture.gbuffers.colortex14=minecraft:textures/misc/enchanted_glint_item.png
# C5 is image-only in composite. Its sampler can address the live block atlas.
texture.composite.colortex5=minecraft:textures/atlas/blocks.png
texture.composite.colortex1=minecraft:textures/atlas/blocks_n.png
texture.composite.colortex2=minecraft:textures/atlas/blocks_s.png
# C13 holds persistent native-resolution HDR, linear depth and four state pixels.
size.buffer.colortex13=1.0 1.0
scale.deferred=0.25
scale.composite2=0.25
scale.composite3=0.25
# Option macros are unavailable during the loader's first screen/profile scan.
#ifdef VOLUMETRIC_RESOLUTION
#if VOLUMETRIC_RESOLUTION == 0
scale.composite=0.25
scale.composite1=0.25
#else
scale.composite=0.5
scale.composite1=0.5
#endif
#else
scale.composite=0.5
scale.composite1=0.5
#endif
screen.SKY = SKY_HAZE SKY_EXPOSURE SKY_SAMPLES CELESTIAL_SIZE
screen.SKY.columns = 2
screen.CLOUDS = CLOUD_QUALITY CLOUD_COVERAGE CLOUD_DENSITY CLOUD_BRIGHTNESS CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_SIZE CLOUD_SPEED CLOUD_SHADOW_STRENGTH CLOUD_NIGHT_BRIGHTNESS
screen.CLOUDS.columns = 2

# Companion controls configure independent raster maps and radiance transport.
screen.LOCAL_LIGHTS = ENABLE_COLOURED_LIGHTING COLOURED_VOLUME_SIZE COLOURED_LIGHT_STEPS COLOURED_LIGHT_INTENSITY
screen.LOCAL_LIGHTS.columns = 2
screen.GI = GI_QUALITY GI_MULTIBOUNCE GI_STRENGTH GI_REFLECTANCE COLOURED_VOLUME_SIZE
screen.GI.columns = 2

# Keep the bloom viewport consistent with bloomSize(); earlier passes reuse the full allocation.
#if BLOOM_RESOLUTION == 0
scale.composite15=0.5
scale.composite16=0.5
scale.composite17=0.5
scale.composite18=0.5
scale.composite19=0.5
#else
scale.composite15=1.0
scale.composite16=1.0
scale.composite17=1.0
scale.composite18=1.0
scale.composite19=1.0
#endif

# Surface materials and non-overworld environments have independent budgets.
screen.MATERIALS = ENABLE_MATERIAL_REFLECTIONS MATERIAL_REFLECTION_STRENGTH MATERIAL_GLOSS_ROUGHNESS MATERIAL_ANISOTROPY ORE_GLOW_STRENGTH POM_QUALITY POM_DISTANCE
screen.MATERIALS.columns = 2
screen.DIMENSIONS = NETHER_AMBIENT NETHER_FOG_DENSITY END_AMBIENT END_FOG_DENSITY
screen.DIMENSIONS.columns = 2



# Atmospheric additions share the existing volume and sky cache budgets.
screen.ATMOSPHERE = GROUND_FOG_STRENGTH GROUND_FOG_HEIGHT ATMOSPHERE_STEPS AURORA_STRENGTH AURORA_SPEED AURORA_STEPS TWILIGHT_STRENGTH NETHER_ATMOSPHERE END_ATMOSPHERE AIR_SCATTER_STRENGTH AIR_SCATTER_STEPS
screen.ATMOSPHERE.columns = 2

# Water reflections also consume native shadow-view geometry when GI is off.
shadow.culling=false
#if ENABLE_COLOURED_LIGHTING == 1 || GI_QUALITY > 0
program.world-1/shadow.enabled=true
#else
program.world-1/shadow.enabled=false
#endif
