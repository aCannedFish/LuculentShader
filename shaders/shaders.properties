# Blend the sky base and sunset layer with alpha.
# Add sun/moon sprites so their black backgrounds do not cover the sky.
blend.gbuffers_skybasic=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_skytextured=ONE ONE ONE ONE
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Non-water fragments preserve water metadata with zero output alpha.
blend.gbuffers_water.colortex9=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex7=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Reuse geometry/light attachments after opaque drawing; retain debug data.
#if DEBUG_VIEW == 0
blend.gbuffers_water.colortex1=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex2=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#else
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
#endif
blend.gbuffers_clouds=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#ifdef IS_IRIS
blend.gbuffers_lightning=SRC_ALPHA ONE ZERO ONE
alphaTest.gbuffers_lightning=off
#endif
# Weather stores background transmittance in C0 alpha for the medium pass.
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE_MINUS_SRC_ALPHA
#if DEBUG_VIEW == 0
blend.gbuffers_weather.colortex1=ONE ONE ONE ONE
#endif
alphaTest.gbuffers_clouds=off
alphaTest.gbuffers_weather=off
# Keep low-opacity water fragments through the loader alpha test.
alphaTest.gbuffers_water=off

# Shadow colour stores the nearest caster and must overwrite its predecessor.
blend.shadow=off
# Opaque material must survive the translucent shadow draw, as does shadowtex1.
#ifdef IS_IRIS
blend.shadow.colortex1=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#else
blend.shadow.shadowcolor1=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#endif

# Composite draws volumetric clouds; disable the vanilla cloud mesh.
clouds=off
rain.depth=false
# Opaque splash particles must reach depth before the water metadata is drawn.
particles.before.deferred=true
# Smooth puddle eligibility using the current biome precipitation type.
uniform.float.rainBiome=smooth(91, if(in(biome_precipitation, 1), 1.0, 0.0), 6.0, 6.0)
# Use native bolt events on Iris; the legacy path detects Minecraft's actual sky flash.
#ifdef IS_IRIS
uniform.float.lightningFlash=smooth(92, if(lightningBoltPosition.w > 0.5, 1.0, if(equals(skyColor.r, skyColor.g, 0.01) && skyColor.r > 0.3 && rainStrength > 0.5, 1.0, 0.0)), 0.0, 0.12)
#else
uniform.float.lightningFlash=smooth(92, if(equals(skyColor.r, skyColor.g, 0.01) && skyColor.r > 0.3 && rainStrength > 0.5, 1.0, 0.0), 0.0, 0.12)
#endif

